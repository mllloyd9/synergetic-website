[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self' https: data:; img-src 'self' https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:;"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[redirects]]
from = "http://*"
to = "https://:splat"
status = 301
force = true

[build]
command = "npx vite build"
publish = "dist"